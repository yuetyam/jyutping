name: Probe Simulator Apps

on:
  workflow_dispatch:
  push:
    branches: [ "probe-sim-apps" ]

jobs:
  probe:
    runs-on: xcode-27
    steps:
      - name: List available apps
        run: |
          DEVICE_NAME=$(xcrun simctl list devices available | grep -m1 -E "iPhone [0-9]" | sed -E 's/^[[:space:]]*//; s/[[:space:]]*\(.*//' | sed -E 's/[[:space:]]*$//')
          echo "Using simulator: ${DEVICE_NAME}"
          xcrun simctl boot "${DEVICE_NAME}" || true
          xcrun simctl bootstatus "${DEVICE_NAME}" -b
          xcrun simctl listapps booted | grep -iE 'note|mobilenotes|備忘|Notes|mobilemail|safari' || true
          echo '--- first 120 lines ---'
          xcrun simctl listapps booted | sed -n '1,120p'
